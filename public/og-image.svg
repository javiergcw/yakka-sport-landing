<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Background decoration circles -->
  <circle cx="1000" cy="100" r="80" fill="#10b981" opacity="0.1"/>
  <circle cx="200" cy="530" r="60" fill="#10b981" opacity="0.1"/>
  <circle cx="600" cy="315" r="120" fill="#10b981" opacity="0.05"/>
  
  <!-- Logo -->
  <circle cx="300" cy="315" r="80" fill="url(#logoGradient)"/>
  <circle cx="300" cy="315" r="70" fill="none" stroke="white" stroke-width="3"/>
  <text x="300" y="335" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="white">Y</text>
  
  <!-- Text content -->
  <text x="450" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#111827">YAKKA</text>
  <text x="450" y="320" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#374151">SPORT</text>
  
  <!-- Coming Soon text -->
  <text x="450" y="400" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#6b7280">Something Amazing is</text>
  <text x="450" y="450" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#10b981">Coming Soon</text>
  
  <!-- Subtitle -->
  <text x="450" y="500" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#9ca3af">Revolutionary Sports Experience</text>
</svg>
